services:
  backend:
    build: ./backend/backend
    environment:
      DATABASE_URL: sqlite:////data/pramaanika.db
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - pramaanika_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pramaanika_data:
